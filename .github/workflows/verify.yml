# EVEN GIRL — doğrulama kapıları
#
# NEDEN CI GEREKLİ
# Dört kapı (güvenlik yapılandırması, gizlilik, i18n, testler) yerelde
# `npm run verify` ile çalışıyordu. Ama yalnızca biri hatırlayıp
# çalıştırdığında çalışan bir kapı, kapı değildir — belgeler bunları
# "zorunlu kılınmış değişmezler" diye anlatırken hiçbir şey itmede
# doğrulamıyordu. Bu dosya iddiayı gerçek yapar.
#
# NE ÇALIŞMAZ: verify:release (üretim yer tutucu kapısı). Yer tutucular
# geliştirme sırasında NORMALDİR; her push'ta kırmızıya döndürmek CI'ı
# gürültüye boğar ve insanlar kırmızıyı görmezden gelmeye başlar.
# O kapı yalnızca sürüm etiketlerinde çalışır (release-gate işi).

name: verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Elle tetikleme: bağımlılık güncellemesi sonrası kontrol için.
  workflow_dispatch:

# Aynı dal için yeni push geldiğinde eski çalıştırmayı iptal et — bekleyen
# eski sonuç kimseye bir şey söylemez ve sıra işgal eder.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # `npm ci` kullanılıyor, `npm install` değil: lock dosyasına birebir
      # uyar ve lock ile package.json ayrıştığında SESSİZCE düzeltmek yerine
      # HATA verir. CI'ın işi tam olarak budur.
      - run: npm ci

      # Test bulucu biçimi önemli: `node --test "tests/**/*.test.js"` tırnaklı
      # glob'u node'a harfiyen geçirir ve Node 20 onu genişletmez — CI'ın ilk
      # çalıştırmasında tam olarak bu düştü. Kabuk globu (`tests/*.test.js`)
      # çalışır ama ALT DİZİNLERİ sessizce atlar. package.json'daki find
      # tabanlı biçim ikisini de çözer.
      - name: Moderasyon, ban-hammer, deepfake ve kalıcılık testleri
        run: npm test

  client:
    name: İstemci (kapılar + testler)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client_mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client_mobile/package-lock.json

      - run: npm ci

      # Kapılar TEK TEK çalıştırılıyor, `npm run verify` zinciriyle değil.
      # Zincir ilk hatada durur; hangi kapının düştüğünü görmek için log
      # okumak gerekir. Ayrı adımlar GitHub arayüzünde doğrudan gösterir.
      # `if: always()` sayesinde biri düşse de diğerleri çalışır — tek
      # push'ta bütün sorunları görmek, dört tur beklemekten iyidir.
      - name: Güvenlik yapılandırması (SSL pin tutarlılığı + model özetleri)
        run: npm run verify:security

      - name: Gizlilik (yasak API, paket ve izinler)
        if: always()
        run: npm run verify:privacy

      - name: i18n (8 dil, yer tutucu paritesi)
        if: always()
        run: npm run verify:i18n

      - name: Mağaza ürünleri (kimlik ve fiyat tutarlılığı)
        if: always()
        run: npm run verify:store

      - name: Native proje iskeleti (derlenebilirlik)
        if: always()
        run: npm run verify:native

      - name: Tip kontrolü
        if: always()
        run: npm run typecheck

      - name: Testler
        if: always()
        run: npm test

  # Sürüm etiketlerinde ek kapı: üretim yer tutucusu kalmışsa sürüm çıkmaz.
  release-gate:
    name: Sürüm yer tutucu kapısı
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, client]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Yer tutucular temiz mi
        run: node tools/verify-release-ready.mjs
