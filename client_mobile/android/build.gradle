/**
 * Kök Gradle yapılandırması.
 *
 * SÜRÜMLER SABİTLENMİŞ: `+` veya aralık kullanılmıyor. Kayan sürüm, aynı
 * commit'in bugün derlenip yarın derlenmemesi demektir ve hata mesajı
 * değişikliğin nereden geldiğini söylemez.
 */
buildscript {
  ext {
    buildToolsVersion = "35.0.0"
    minSdkVersion = 24          // Android 7.0 — SSL pinning ve Keystore için taban
    compileSdkVersion = 35
    targetSdkVersion = 35
    ndkVersion = "27.1.12297006"
    kotlinVersion = "2.0.21"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath("com.android.tools.build:gradle:8.7.2")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
  }
}

apply plugin: "com.facebook.react.rootproject"
