# Bellek: RN derlemeleri varsayılan yığınla OOM verir.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.daemon=true

android.useAndroidX=true
android.enableJetifier=false

# Yeni mimari: RN 0.76 varsayılanı.
newArchEnabled=true
hermesEnabled=true

# APK yerine AAB üretilir (Play Store zorunlu).
android.enableR8.fullMode=true

# İMZA ANAHTARI BURAYA YAZILMAZ.
# Bu dosya depoya girer; imza sırrı girmez. Değerler CI ortam
# değişkenlerinden veya ~/.gradle/gradle.properties'ten okunur.
